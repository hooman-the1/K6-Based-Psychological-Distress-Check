{% extends "assessments/base.html" %}

{% block title %}History | K6-Based Psychological Distress Check{% endblock %}

{% block content %}
    <h1>History</h1>
    <p data-history-unavailable hidden>Saved history is unavailable in this browser.</p>
    <section data-history-empty hidden>
        <p>No saved results yet.</p>
        <a class="button button--primary" href="{% url 'test' %}">Take Test</a>
    </section>
    <figure data-history-chart-container hidden>
        <h2>Score trend</h2>
        <svg
            data-history-chart
            role="img"
            aria-label="Saved score trend from oldest to newest"
            viewBox="0 0 320 180"
            width="100%"
            preserveAspectRatio="xMidYMid meet"
        >
            <line
                data-history-cutoff-line
                x1="24"
                x2="296"
                y1="83.83333333333333"
                y2="83.83333333333333"
                stroke="currentColor"
                stroke-dasharray="4 4"
            ></line>
        </svg>
        <figcaption data-history-chart-explanation>
            Scores are shown from oldest to newest. The horizontal line marks the cutoff score of 13.
        </figcaption>
    </figure>
    <ul data-history-results hidden></ul>
    <button class="button button--danger" type="button" data-clear-history hidden>Clear All History</button>
{% endblock %}
